<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aurora Modern | {{ user.name }}</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary: #4f46e5;
            --glass: rgba(255, 255, 255, 0.7);
            --border: rgba(255, 255, 255, 0.4);
            --glass-dark: rgba(255, 255, 255, 0.15);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            /* Modern Aurora Background */
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 80px 20px; /* Added padding for top button */
        }

        /* THE GLASS SLAB */
        .resume-card {
            width: 900px;
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 32px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            display: grid;
            grid-template-columns: 320px 1fr;
        }

        /* SIDEBAR */
        .sidebar {
            background: rgba(255, 255, 255, 0.3);
            padding: 50px 40px;
            border-right: 1px solid var(--border);
        }

        .profile-box {
            text-align: center;
        }

        .profile-box img {
            width: 150px;
            height: 150px;
            border-radius: 40px; /* Modern "Squircle" */
            object-fit: cover;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 4px solid #fff;
        }

        .profile-box h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .email-tag {
            font-size: 13px;
            background: #fff;
            padding: 8px 16px;
            border-radius: 100px;
            color: var(--primary);
            font-weight: 600;
            display: inline-block;
        }

        /* MAIN CONTENT */
        .main {
            padding: 60px;
            color: #334155;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #64748b;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--primary);
        }

        .content-body {
            background: rgba(255, 255, 255, 0.5);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid var(--border);
            line-height: 1.7;
            font-size: 15px;
            white-space: pre-line;
        }

        /* SKILLS */
        .skill-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .skill-tag {
            background: var(--primary);
            color: #fff;
            padding: 8px 18px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }

        /* NAVIGATION BUTTONS */
        .btn-glass {
            position: fixed;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            padding: 12px 24px;
            border-radius: 16px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: 0.3s;
            text-decoration: none;
            color: #1e293b;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .btn-save {
            bottom: 30px;
            right: 30px;
        }

        .btn-back {
            top: 20px;
            left: 20px;
        }

        .btn-glass:hover {
            background: var(--primary);
            color: #fff;
            transform: translateY(-3px);
        }

        @media print {
            body { background: white; padding: 0; }
            .resume-card { 
                width: 100%; border-radius: 0; box-shadow: none; border: none; 
                grid-template-columns: 250px 1fr; background: white;
            }
            .btn-glass { display: none; }
            .sidebar { background: #f8fafc !important; }
            .content-body { background: transparent !important; border: none; padding: 0; }
        }
    </style>
</head>

<body>

<a href="/profile" class="btn-glass btn-back">
    <i class="fa-solid fa-arrow-left"></i> Dashboard
</a>

<button onclick="window.print()" class="btn-glass btn-save">
    <i class="fa-solid fa-cloud-arrow-down"></i> SAVE AS PDF
</button>

<div class="resume-card">
    
    <aside class="sidebar">
        <div class="profile-box">
            {% if user.photo %}
                <img src="{{ url_for('static', filename='uploads/' + user.photo) }}">
            {% else %}
                <img src="{{ url_for('static', filename='uploads/default.png') }}">
            {% endif %}
            
            <h1>{{ user.name }}</h1>
            <span class="email-tag">{{ user.email }}</span>
        </div>

        <div class="section" style="margin-top: 50px;">
            <div class="section-title"><i class="fa-solid fa-cube"></i> Skills</div>
            <div class="skill-wrap">
                {% for skill in resume.skills.split(',') %}
                    <div class="skill-tag">{{ skill.strip() }}</div>
                {% endfor %}
            </div>
        </div>
    </aside>

    <main class="main">
        
        <div class="section">
            <div class="section-title"><i class="fa-solid fa-book-open"></i> Education</div>
            <div class="content-body">{{ resume.education }}</div>
        </div>

        <div class="section">
            <div class="section-title"><i class="fa-solid fa-briefcase"></i> Experience</div>
            <div class="content-body">{{ resume.experience }}</div>
        </div>

        <div class="section">
            <div class="section-title"><i class="fa-solid fa-rocket"></i> Projects</div>
            <div class="content-body">{{ resume.projects }}</div>
        </div>

    </main>

</div>

</body>
</html>
